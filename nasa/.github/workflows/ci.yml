name: AstroCare CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint, Build, and Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Run Redis integration tests
        env:
          ASTRO_TEST_REDIS_URL: redis://localhost:6379
        run: npm run test:redis

  simulator-test:
    name: Physiological Simulator Test (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: python -m pytest

      - name: Verify CLI dry-run execution
        run: python -m src.cli --scenario normal_day --duration 10 --dry-run

  ml-sidecar-test:
    name: ML Sidecar Test & Evaluation (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-sidecar/requirements.txt
          pip install -r simulator/requirements.txt

      - name: Run ML Sidecar pytest suite
        run: python -m pytest ml-sidecar/tests -v

      - name: Run Evaluation Harness
        run: python ml-sidecar/eval/evaluate.py

