services:
  - type: web
    name: aj-nasa-astrocare
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: nasa/backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: ASTRO_MONGODB_URI
        sync: false
      - key: ASTRO_JWT_ACCESS_SECRET
        sync: false
      - key: ASTRO_JWT_REFRESH_SECRET
        sync: false
      - key: ASTRO_INGEST_API_KEY
        sync: false
      - key: ASTRO_EVENT_BUS_DRIVER
        value: memory
      - key: ASTRO_REDIS_REQUIRED
        value: false
      - key: ASTRO_CORS_ORIGINS
        value: https://avishjain9.github.io
      - key: ASTRO_ENV
        value: production
      - key: ASTRO_PORT
        value: 10000
